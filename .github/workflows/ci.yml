name: ci

on:
  push:
  pull_request:

jobs:
  python-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall tools/transcribe_audio tools/transcribe_audio_mcp
